<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H, mx = 0.5, my = 0.5, energy = 0;

function resize() {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
}

onresize = resize;
resize();

onpointermove = e => {
  const x = e.clientX / W, y = e.clientY / H;
  energy = Math.min(1, energy + Math.hypot(x - mx, y - my) * 3);
  mx = x;
  my = y;
};

function field(x, y) {
  return 0.23 * Math.sin(11*y + 4*x + 5*mx)
       + 0.17 * Math.sin(17*x - 8*y + 6*my)
       + 0.13 * Math.cos(21*y + 11*x)
       + 0.09 * Math.sin(38*x + 24*y)
       + 0.38 * energy * Math.sin(45*x + 37*y);
}

function draw() {
  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, W, H);
  ctx.lineWidth = 0.7;

  for (let i = 0; i < 80; i++) {
    let y = i * H / 79;
    ctx.beginPath();
    ctx.moveTo(0, y);

    for (let x = 0; x < W; x += 4) {
      y += field(x / W, y / H) * 3.2;
      ctx.lineTo(x + 4, y);
    }

    ctx.strokeStyle = `rgba(255,255,255,${0.26 + (i % 5) * 0.055})`;
    ctx.stroke();
  }

  energy *= 0.956;
  requestAnimationFrame(draw);
}

draw();
</script>
