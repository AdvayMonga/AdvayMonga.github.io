
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advay Monga</title>
<style>
  body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
  }

  canvas {
    position: fixed;
    inset: 0;
    z-index: -1;
  }

  main {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  h1 {
    font-size: clamp(3rem, 8vw, 7rem);
    font-weight: 400;
    letter-spacing: -4px;
    margin: 0 0 25px;
  }

  nav {
    display: flex;
    align-items: center;
    gap: 25px;
  }

  a {
    color: white;
    text-decoration: none;
  }

  a:hover { opacity: 0.6; }

  img {
    width: 20px;
    height: 20px;
    filter: invert(1);
    vertical-align: middle;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<main>
  <h1>Advay Monga</h1>
  <nav>

    <a href="https://github.com/AdvayMonga" aria-label="GitHub">
      <img src="icons/github.svg" alt="">
    </a>

    <a href="https://www.linkedin.com/in/advay-monga-045735235/" aria-label="LinkedIn">
      <img src="icons/linkedin.svg" alt="">
    </a>

    <a href="https://x.com/AdvayMonga" aria-label="X">
      <img src="icons/twitter-x.svg" alt="">
    </a>

    <a href="https://substack.com/@advaymonga" aria-label="Substack">
      <img src="icons/substack.svg" alt="">
    </a>

    <a href="mailto:advaymonga@gmail.com" aria-label="Email">
      <img src="icons/envelope-fill.svg" alt="">
    </a>
  </nav>
</main>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H, mx = 0.5, my = 0.5, energy = 0;

function resize() {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
}

onresize = resize;
resize();

onpointermove = e => {
  const x = e.clientX / W, y = e.clientY / H;
  energy = Math.min(1, energy + Math.hypot(x - mx, y - my) * 3);
  mx = x;
  my = y;
};

function field(x, y) {
  return 0.23 * Math.sin(11*y + 4*x + 5*mx)
       + 0.17 * Math.sin(17*x - 8*y + 6*my)
       + 0.13 * Math.cos(21*y + 11*x)
       + 0.09 * Math.sin(38*x + 24*y)
       + 0.38 * energy * Math.sin(45*x + 37*y);
}

function draw() {
  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, W, H);
  ctx.lineWidth = 0.7;

  for (let i = 0; i < 80; i++) {
    let y = i * H / 79;
    ctx.beginPath();
    ctx.moveTo(0, y);

    for (let x = 0; x < W; x += 4) {
      y += field(x / W, y / H) * 3.2;
      ctx.lineTo(x + 4, y);
    }

    ctx.strokeStyle = `rgba(255,255,255,${0.26 + (i % 5) * 0.055})`;
    ctx.stroke();
  }

  energy *= 0.956;
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
