
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advay Monga</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    background: black;
    color: white;
    font-family: Georgia, 'Times New Roman', serif;
  }

  canvas {
    position: fixed;
    inset: 0;
    z-index: -1;
  }

  main {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  h1 {
    font-size: clamp(2.5rem, 6.5vw, 5.5rem);
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 300;
    letter-spacing: -2px;
    margin: 0 0 25px;
  }

  nav {
    display: flex;
    align-items: center;
    gap: 25px;
  }

  a {
    color: white;
    text-decoration: none;
  }

  a:hover { opacity: 0.6; }

  img {
    width: 20px;
    height: 20px;
    filter: invert(1);
    vertical-align: middle;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<main>
  <h1>Advay Monga</h1>
  <nav>

    <a href="https://github.com/AdvayMonga" aria-label="GitHub">
      <img src="icons/github.svg" alt="">
    </a>

    <a href="https://www.linkedin.com/in/advay-monga-045735235/" aria-label="LinkedIn">
      <img src="icons/linkedin.svg" alt="">
    </a>

    <a href="https://x.com/AdvayMonga" aria-label="X">
      <img src="icons/twitter-x.svg" alt="">
    </a>

    <a href="https://substack.com/@advaymonga" aria-label="Substack">
      <img src="icons/substack.svg" alt="">
    </a>

    <a href="mailto:advaymonga@gmail.com" aria-label="Email">
      <img src="icons/envelope-fill.svg" alt="">
    </a>
  </nav>
</main>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const off = document.createElement("canvas");
const octx = off.getContext("2d");
const S = 4;

let W, H, mx = 0.5, my = 0.5, sx = 0.5, sy = 0.5, time = 0;

function resize() {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
  off.width = Math.ceil(W / S);
  off.height = Math.ceil(H / S);
}

onresize = resize;
resize();

onpointermove = e => {
  mx = e.clientX / W;
  my = e.clientY / H;
};

// Domain-warped sine bands: sin(7(q + 0.3 sin(2.7r))), q and r warped by the mouse.
function draw() {
  sx += (mx - sx) * 0.05;
  sy += (my - sy) * 0.05;
  const m = Math.min(W, H), img = octx.createImageData(off.width, off.height), px = img.data;

  for (let j = 0; j < off.height; j++) for (let i = 0; i < off.width; i++) {
    const u = i * S / m, v = j * S / m;
    const q = u + 0.35 * Math.sin(2.1 * v + 0.3 * time + 4 * sx);
    const r = v + 0.35 * Math.sin(1.9 * q - 0.25 * time + 4 * sy);
    const val = Math.sin(7 * (q + 0.3 * Math.sin(2.7 * r + 0.2 * time)));
    const k = (j * off.width + i) * 4;
    px[k] = px[k + 1] = px[k + 2] = 55 * Math.min(1, Math.max(0, val * 3 + 0.5));
    px[k + 3] = 255;
  }

  octx.putImageData(img, 0, 0);
  ctx.drawImage(off, 0, 0, W, H);
  time += 0.016;
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
